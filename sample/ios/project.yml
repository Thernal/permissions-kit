# The iOS sample. `xcodegen generate` (in this directory) rebuilds Sample.xcodeproj from this file;
# the generated project is committed so opening the sample needs Xcode only.
name: Sample
options:
  bundleIdPrefix: io.thernal.permissionskit
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Sample:
    type: application
    platform: iOS
    sources:
      - Sample
    info:
      path: Sample/Info.plist
      properties:
        CFBundleDisplayName: permissions-kit
        UILaunchScreen: {}
        # One usage description per AppPermission that iOS asks for; without it the app crashes on request.
        NSCameraUsageDescription: The sample shows how the camera permission is requested.
        NSMicrophoneUsageDescription: The sample shows how the microphone permission is requested.
        NSPhotoLibraryUsageDescription: The sample shows how the photo library permission is requested.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.thernal.permissionskit.sample
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SampleShared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The framework is built for arm64 simulators only (iosSimulatorArm64), as every kit targets.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode
